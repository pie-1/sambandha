services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ml:
    build: ./ml-service
    ports:
      - "8000:8000"
    restart: unless-stopped

  api:
    build: ./server
    environment:
      - MONGO_URI=mongodb://mongo:27017/sambandh
      - ML_SERVICE_URL=http://ml:8000
      - JWT_SECRET=demo-secret-change-me
      - JWT_EXPIRE=7d
      - CLIENT_URL=http://localhost:5173
      - PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      ml:
        condition: service_started
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo-data:
