[project]
name = "sambandha-ml-service"
version = "0.1.0"
description = "Python ML training/inference service for Sambandh health models (scikit-learn)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=2.0",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "matplotlib>=3.9",
    "pandas>=2.2",
    "ipykernel>=6.29",
    "notebook>=7.2",
    "nbconvert>=7.16",
    "nbformat>=5.10",
]

[tool.uv]
package = false
